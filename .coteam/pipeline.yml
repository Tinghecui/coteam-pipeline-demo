version: 1
preset: startup
mode: on
base: main
stack:
  setup: []
  test: "npm test"
  check: ["npm test"]
  ui_paths: ["public/**"]
risk:
  # Test setting: every change under src/ asks an owner (level 2).
  level2: ["src/**"]
limits:
  max_parallel: 2
  daily_usd: 15
  issue_max_usd: 8
  executor_minutes: 40

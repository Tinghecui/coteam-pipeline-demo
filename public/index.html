<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>To-do</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 28rem; margin: 3rem auto; }
      li.done span { text-decoration: line-through; color: #888; }
      ul { list-style: none; padding: 0; }
      li { display: flex; gap: 0.5rem; align-items: center; padding: 0.25rem 0; }
      li span { flex: 1; }
    </style>
  </head>
  <body>
    <h1>To-do</h1>
    <form id="new"><input id="title" placeholder="What needs doing?" autofocus /> <button>Add</button></form>
    <ul id="items"></ul>
    <p id="footer"></p>
    <button id="clear">Clear done</button>
    <script type="module">
      import { addItem, clearDone, footerText, removeItem, toggleItem } from "/src/todo.js"
      import { loadList, saveList } from "/src/storage.js"
      let list = loadList(localStorage)
      const $ = (id) => document.getElementById(id)
      // Every change goes through here, so the stored list never lags behind the page.
      function update(next) {
        list = next
        saveList(list, localStorage)
        render()
      }
      function render() {
        $("items").replaceChildren(
          ...list.map((item) => {
            const li = document.createElement("li")
            li.className = item.done ? "done" : ""
            const box = Object.assign(document.createElement("input"), { type: "checkbox", checked: item.done })
            box.onchange = () => update(toggleItem(list, item.id))
            const text = Object.assign(document.createElement("span"), { textContent: item.title })
            const del = Object.assign(document.createElement("button"), { textContent: "×" })
            del.onclick = () => update(removeItem(list, item.id))
            li.append(box, text, del)
            return li
          }),
        )
        $("footer").textContent = footerText(list)
      }
      $("new").onsubmit = (e) => {
        e.preventDefault()
        try { update(addItem(list, $("title").value)); $("title").value = "" } catch (err) { alert(err.message) }
      }
      $("clear").onclick = () => update(clearDone(list))
      render()
    </script>
  </body>
</html>
